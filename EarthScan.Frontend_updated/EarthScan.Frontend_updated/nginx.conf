server {
    listen 80;
    server_name localhost;

    # Root folder for built React application
    root /usr/share/nginx/html;
    index index.html;

    # Enable support for React Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Increase client body buffer size to support attachment uploads
    client_max_body_size 100M;

    # Reverse proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:5130/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy static uploaded files to backend container
    location /uploads/ {
        proxy_pass http://backend:5130/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
