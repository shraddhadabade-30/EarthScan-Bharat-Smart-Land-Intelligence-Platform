services:
  backend:
    build:
      context: ./EarthScan.Backend_updated/EarthScan.Backend_updated
      dockerfile: Dockerfile
    container_name: earthscan_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=$DB_CONNECTION_STRING
      - Jwt__Key=$JWT_KEY
      - Jwt__Issuer=$JWT_ISSUER
      - Jwt__Audience=$JWT_AUDIENCE
      - ApiKeys__Gemini=$GEMINI_API_KEY
      - ApiKeys__DataGov=$DATAGOV_API_KEY
      - ApiResources__GroundwaterLevel=$GW_LEVEL_RESOURCE_ID
      - ApiResources__GroundwaterQuality=$GW_QUALITY_RESOURCE_ID
      - ApiResources__GroundwaterMapping=$GW_MAPPING_RESOURCE_ID
      - ApiResources__MandiAgmarknet=$MANDI_RESOURCE_ID
    ports:
      - "5130:5130"
    volumes:
      - ./India_Groundwater_Analysis_2024.xlsx:/app/India_Groundwater_Analysis_2024.xlsx
      - ./wtrqlty_grndwtr_2008.csv:/app/wtrqlty_grndwtr_2008.csv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build:
      context: ./EarthScan.Frontend_updated/EarthScan.Frontend_updated
      dockerfile: Dockerfile
    container_name: earthscan_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
